<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E3A8A">
<title>쿠팡 통합업무</title>
<style>
:root{
  --navy-950:#0A1430; --navy-900:#0E1B3F; --navy-800:#152660;
  --brand:#2452E6; --brand-dk:#1B41BC; --brand-tint:#EBF0FF;
  --bg:#F4F6FA; --surface:#FFFFFF;
  --ink:#101828; --ink-2:#475467; --ink-3:#98A2B3; --line:#E4E9F0;
  --ok:#12813F; --ok-bg:#E8F6EE; --warn:#B54708; --warn-bg:#FEF1E2;
  --danger:#C0212E; --danger-bg:#FDEBEC; --neu:#5B6B82; --neu-bg:#EEF2F6;
  --r:14px; --sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --sh-lg:0 4px 8px -2px rgba(16,24,40,.08),0 12px 24px -4px rgba(16,24,40,.10);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5;letter-spacing:-.1px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::selection{background:var(--brand-tint)}

/* ═══ 앱바 (모바일 상단) ═══ */
.appbar{position:sticky;top:0;z-index:20;background:var(--navy-900);color:#fff;
  padding:calc(env(safe-area-inset-top) + 13px) 18px 13px;display:flex;align-items:center;gap:11px;
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 2px 8px rgba(10,20,48,.35)}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--brand),#5B8CFF);
  display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 2px 6px rgba(36,82,230,.45)}
.logo svg{width:17px;height:17px}
.appbar h1{font-size:16px;font-weight:800;letter-spacing:-.3px;flex:1;line-height:1.15}
.appbar h1 small{display:block;font-size:10px;font-weight:600;color:#8FA3D9;letter-spacing:.4px}
.appbar .sub{font-size:11px;color:#8FA3D9;font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;background:#3DDC84;box-shadow:0 0 0 3px rgba(61,220,132,.22);flex:none}
.dot.busy{background:#FFC53D;box-shadow:0 0 0 3px rgba(255,197,61,.22);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}

/* ═══ 레이아웃 ═══ */
.shell{max-width:1220px;margin:0 auto;padding:16px 14px 92px}
.view{display:none}.view.active{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1}}

/* ═══ 내비게이션 ═══ */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--surface);
  border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -4px 16px rgba(16,24,40,.05)}
.tabbar .brand{display:none}
.tabbar button{flex:1;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;color:var(--ink-3);font-weight:600;position:relative;transition:color .15s}
.tabbar button.on{color:var(--brand)}
.tabbar button.on::before{content:"";position:absolute;top:0;width:26px;height:3px;border-radius:0 0 4px 4px;background:var(--brand)}
.tabbar svg{width:22px;height:22px}

/* ═══ 카드 ═══ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);padding:18px;margin-bottom:13px}
.card h3{font-size:12px;color:var(--ink-3);font-weight:800;margin-bottom:12px;
  letter-spacing:.5px;text-transform:uppercase}
.card h3 .norm{text-transform:none;letter-spacing:0;font-weight:500}

/* ═══ KPI 타일 ═══ */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:13px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);padding:14px 15px;transition:box-shadow .15s,transform .15s}
.kpi:hover{box-shadow:var(--sh-lg)}
.kpi .head{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.kpi .ico{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-size:15px;background:var(--brand-tint);flex:none}
.kpi .l{font-size:11.5px;color:var(--ink-2);font-weight:700;line-height:1.25}
.kpi .v{font-size:23px;font-weight:800;letter-spacing:-.6px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .s{font-size:11px;color:var(--ink-3);margin-top:3px;font-variant-numeric:tabular-nums}
.kpi.accent .v{color:var(--brand)} .kpi.accent .ico{background:var(--brand-tint)}
.kpi.warn .v{color:var(--warn)} .kpi.warn .ico{background:var(--warn-bg)}
.kpi.danger .v{color:var(--danger)} .kpi.danger .ico{background:var(--danger-bg)}
.kpi.ok .v{color:var(--ok)} .kpi.ok .ico{background:var(--ok-bg)}

/* ═══ 상태 분포 바 (2px 간격 마크 스펙) ═══ */
.distbar{display:flex;gap:2px;height:12px;border-radius:6px;overflow:hidden;margin:2px 0 10px}
.distbar i{display:block;height:100%;min-width:6px}
.legend{display:flex;flex-wrap:wrap;gap:7px 14px;font-size:11.5px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:5px;font-weight:600;font-variant-numeric:tabular-nums}
.legend b{width:9px;height:9px;border-radius:3px;flex:none}

/* ═══ 상태 칩 (색+점+라벨 — 색맹 안전) ═══ */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2.5px 9px;border-radius:99px;
  font-size:11px;font-weight:700;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-ok{background:var(--ok-bg);color:var(--ok)} .c-warn{background:var(--warn-bg);color:var(--warn)}
.c-danger{background:var(--danger-bg);color:var(--danger)} .c-skip{background:var(--neu-bg);color:var(--neu)}

/* ═══ 스텝 리스트 ═══ */
.steps{display:flex;flex-direction:column}
.step{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:7px 2px;border-bottom:1px solid #F0F3F7}
.step:last-child{border-bottom:none}
.step .ic{width:20px;text-align:center;flex:none}

/* ═══ 툴바·세그먼트 ═══ */
.toolbar{display:flex;gap:8px;margin-bottom:11px;flex-wrap:wrap}
.toolbar input,.toolbar select{flex:1;min-width:130px;padding:10px 13px;border:1.5px solid var(--line);
  border-radius:11px;font-size:14px;background:var(--surface);transition:border .15s;color:var(--ink)}
.toolbar input:focus,.toolbar select:focus{outline:none;border-color:var(--brand)}
.seg{display:flex;background:#E8EDF4;border-radius:12px;padding:3px;margin-bottom:11px}
.seg button{flex:1;padding:8.5px 0;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--ink-2);transition:all .15s}
.seg button.on{background:var(--surface);color:var(--brand);box-shadow:0 1px 3px rgba(16,24,40,.12)}

/* ═══ 리스트 카드 (모바일) ═══ */
.slist{display:flex;flex-direction:column;gap:9px}
.srow{background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:var(--sh);
  padding:13px 15px;transition:box-shadow .15s,border .15s;cursor:pointer}
.srow:active{border-color:var(--brand)}
.srow .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;gap:8px}
.srow .id{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.srow .camp{font-size:12.5px;color:var(--ink-2)}
.srow .amt{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.srow .meta{display:flex;gap:6px 11px;font-size:11px;color:var(--ink-3);margin-top:7px;flex-wrap:wrap;align-items:center}

/* ═══ 데이터 그리드 (데스크톱) ═══ */
table.grid{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);display:none}
table.grid th{position:sticky;top:0;background:#F8FAFD;font-size:11px;color:var(--ink-3);font-weight:800;
  letter-spacing:.4px;text-align:left;padding:11px 13px;border-bottom:1px solid var(--line);white-space:nowrap}
table.grid td{padding:10.5px 13px;border-bottom:1px solid #F0F3F7;font-size:13px;font-variant-numeric:tabular-nums}
table.grid tr:last-child td{border-bottom:none}
table.grid tbody tr{transition:background .1s}
table.grid tr:hover td{background:#F6F9FE}
.num{text-align:right}

/* ═══ 실행 버튼 ═══ */
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.abtn{background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:var(--sh);
  padding:14px 10px;text-align:center;font-weight:700;font-size:13px;color:var(--ink);
  transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:5px}
.abtn:hover{border-color:var(--brand);box-shadow:var(--sh-lg);transform:translateY(-1px)}
.abtn:active{transform:scale(.97)}
.abtn .em{font-size:20px;line-height:1}
.abtn.primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(36,82,230,.35)}
.abtn.primary:hover{background:var(--brand-dk)}
.abtn.danger{background:var(--danger-bg);border-color:#F5C2C7;color:var(--danger)}

/* ═══ 로그 ═══ */
.logbox{background:var(--navy-950);color:#C9D4F2;border-radius:var(--r);padding:14px;
  font:12px/1.6 "Cascadia Code",Consolas,monospace;height:310px;overflow:auto;
  white-space:pre-wrap;word-break:break-all;margin-top:13px;border:1px solid #1C2C5E}

/* ═══ 리포트 ═══ */
.rtabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:11px;padding-bottom:2px}
.rtabs button{padding:7.5px 15px;border-radius:99px;background:var(--surface);border:1px solid var(--line);
  box-shadow:var(--sh);font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap;transition:all .15s}
.rtabs button.on{background:var(--navy-900);border-color:var(--navy-900);color:#fff}
.md{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  padding:18px;font-size:13.5px;overflow-x:auto}
.md h1{font-size:16.5px;margin:4px 0 8px;letter-spacing:-.3px}
.md h2{font-size:14px;margin:16px 0 7px;color:var(--brand-dk)}
.md table{border-collapse:collapse;margin:8px 0;min-width:300px}
.md th,.md td{border:1px solid var(--line);padding:6px 10px;font-size:12.5px;font-variant-numeric:tabular-nums}
.md th{background:#F8FAFD;font-weight:700}
.md li{margin-left:18px;margin-bottom:2px}
.md p{margin-bottom:4px}

/* ═══ 상세 시트 ═══ */
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,48,.5);z-index:40;display:none;backdrop-filter:blur(2px)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);
  border-radius:22px 22px 0 0;max-height:82vh;overflow:auto;
  padding:18px 20px calc(22px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .24s cubic-bezier(.3,1,.4,1);
  box-shadow:0 -12px 40px rgba(10,20,48,.3)}
.sheet.open{transform:none}
.sheet .grip{width:38px;height:4.5px;background:var(--line);border-radius:99px;margin:0 auto 15px}
.sheet h2{font-size:16.5px;display:flex;align-items:center;gap:8px;margin-bottom:3px}
.sheet .sub{font-size:12.5px;color:var(--ink-2);margin-bottom:15px}
.dl{display:grid;grid-template-columns:118px 1fr;gap:8px 12px;font-size:13.5px}
.dl dt{color:var(--ink-3);font-weight:600}
.dl dd{font-weight:600;word-break:break-all;font-variant-numeric:tabular-nums}
.dl .sec{grid-column:1/-1;font-size:11px;font-weight:800;color:var(--brand-dk);letter-spacing:.5px;
  border-top:1px solid var(--line);padding-top:11px;margin-top:5px;text-transform:uppercase}
@media(min-width:900px){.sheet{left:50%;right:auto;width:540px;transform:translate(-50%,100%)}
  .sheet.open{transform:translate(-50%,0)}}

/* ═══ TOP 리스트 ═══ */
.toplist{display:flex;flex-direction:column;gap:8px}
.topitem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 13px;
  background:#F8FAFD;border:1px solid #EEF2F7;border-radius:11px;font-size:12.5px;
  cursor:pointer;transition:all .15s}
.topitem:hover{border-color:var(--brand);background:var(--brand-tint)}
.topitem b{font-size:13px}
.bar{height:6px;border-radius:99px;background:#E8EDF4;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}

/* ═══ PIN 게이트 ═══ */
.gate{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(1100px 600px at 70% -10%,#24409A 0%,var(--navy-900) 45%,var(--navy-950) 100%)}
.gate .box{background:#fff;border-radius:22px;padding:32px 28px;width:100%;max-width:350px;text-align:center;
  box-shadow:0 24px 70px rgba(0,0,0,.45)}
.gate .glogo{width:54px;height:54px;border-radius:16px;margin:0 auto 14px;
  background:linear-gradient(135deg,var(--brand),#5B8CFF);display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 20px rgba(36,82,230,.4)}
.gate .glogo svg{width:28px;height:28px}
.gate h2{font-size:18px;margin-bottom:3px;letter-spacing:-.3px}
.gate p{font-size:12.5px;color:var(--ink-2);margin-bottom:20px}
.gate input{width:100%;padding:13px;font-size:24px;text-align:center;letter-spacing:14px;
  border:2px solid var(--line);border-radius:13px;margin-bottom:12px;font-variant-numeric:tabular-nums}
.gate input:focus{outline:none;border-color:var(--brand)}
.gate button{width:100%;padding:14px;background:var(--brand);color:#fff;border-radius:13px;
  font-size:15px;font-weight:700;transition:background .15s;box-shadow:0 6px 16px rgba(36,82,230,.35)}
.gate button:hover{background:var(--brand-dk)}
.gate .err{color:var(--danger);font-size:12.5px;margin-top:9px;min-height:16px}

/* ═══ 데스크톱 (≥900px): 다크 사이드바 ═══ */
@media(min-width:900px){
  .tabbar{top:0;bottom:auto;left:0;right:auto;width:216px;height:100vh;flex-direction:column;
    background:var(--navy-900);border:none;box-shadow:none;padding:0;justify-content:flex-start}
  .tabbar .brand{display:flex;align-items:center;gap:11px;padding:22px 20px 18px;
    border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:10px;color:#fff}
  .tabbar .brand .bt{font-size:15px;font-weight:800;letter-spacing:-.3px;line-height:1.2}
  .tabbar .brand .bt small{display:block;font-size:9.5px;font-weight:600;color:#8FA3D9;letter-spacing:.5px}
  .tabbar button{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:12px;
    padding:12px 20px;font-size:13.5px;color:#93A5D6;margin:1px 10px;border-radius:10px}
  .tabbar button:hover{background:rgba(255,255,255,.06);color:#fff}
  .tabbar button.on{color:#fff;background:rgba(91,140,255,.16)}
  .tabbar button.on::before{top:auto;left:-10px;width:3.5px;height:22px;border-radius:0 4px 4px 0}
  .shell{margin-left:216px;padding:24px 30px 48px;max-width:none}
  .appbar{margin-left:216px;background:var(--surface);color:var(--ink);
    box-shadow:0 1px 0 var(--line);padding:15px 30px}
  .appbar h1 small{color:var(--ink-3)}
  .appbar .sub{color:var(--ink-3)}
  .kpis{grid-template-columns:repeat(6,1fr)}
  .actions{grid-template-columns:repeat(4,1fr)}
  .slist{display:none}
  table.grid{display:table}
  .logbox{height:400px}
}
@media(max-width:899px){ table.grid{display:none!important} }

</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="box">
    <div class="glogo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.5 12h-11z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/></svg></div>
    <h2>쿠팡 통합업무</h2>
    <p>PIN 4자리를 입력하세요</p>
    <input id="pin" type="tel" maxlength="4" inputmode="numeric" placeholder="••••" autofocus>
    <button onclick="login()">접속</button>
    <div class="err" id="pinerr"></div>
  </div>
</div>

<header class="appbar">
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.5 12h-11z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/></svg></div>
  <h1>쿠팡 통합업무<small>UNIVERSAL LIFT · 일일보고 관리</small></h1>
  <span class="sub" id="demobadge"></span>
  <div class="dot" id="livedot"></div>
  <div class="sub" id="clock"></div>
</header>

<main class="shell">

  <!-- 대시보드 -->
  <section class="view active" id="v-dash">
    <div class="kpis" id="kpis"></div>
    <div class="card"><h3>에이전트 최근 실행 <span id="agentTime" style="font-weight:400"></span></h3>
      <div class="steps" id="steps"></div></div>
    <div class="card" id="forkcard" style="display:none;border:2px solid var(--danger)">
      <h3 style="color:var(--danger)">⚠ 버전 충돌 경고</h3><div id="forkmsg" style="font-size:13.5px"></div></div>
    <div class="card" id="tunnelcard" style="display:none">
      <h3>🌐 외부 접속 주소 (LTE/5G에서도)</h3>
      <div style="font-size:13.5px;word-break:break-all"><a id="tunnelurl" href="#" target="_blank"></a></div>
      <div style="font-size:11.5px;color:var(--muted);margin-top:4px">터널 재시작 시 주소가 바뀝니다. 폰 브라우저로 열고 "홈 화면에 추가" 하세요.</div></div>
    <div class="card"><h3>정산 상태 분포</h3>
      <div class="distbar" id="distbar"></div>
      <div class="legend" id="distlegend"></div></div>
    <div class="card"><h3>조치 필요 — 유형별</h3><div class="toplist" id="toplist">로딩...</div></div>
    <div class="card"><h3>빠른 실행</h3>
      <div class="actions">
        <button class="abtn primary" onclick="runTask('daily')"><span class="em">▶</span>전체 대조</button>
        <button class="abtn" onclick="show('settle')"><span class="em">📋</span>정산 현황</button>
        <button class="abtn" onclick="show('report')"><span class="em">📄</span>리포트</button>
        <button class="abtn" onclick="refreshAll()"><span class="em">🔄</span>새로고침</button>
      </div></div>
  </section>

  <!-- 정산·업무 -->
  <section class="view" id="v-settle">
    <div class="seg" id="seg">
      <button class="on" data-m="settle" onclick="setMode('settle')">정산·청구</button>
      <button data-m="as" onclick="setMode('as')">돌발AS</button>
      <button data-m="pm" onclick="setMode('pm')">정기점검</button>
      <button data-m="check" onclick="setMode('check')">확인필요</button>
    </div>
    <div class="toolbar">
      <input id="q" placeholder="검색: ID·캠프·기사·프로젝트" oninput="renderSettle()">
      <select id="fstat" onchange="renderSettle()"><option value="">상태 전체</option></select>
    </div>
    <div class="kpis" id="skpis" style="grid-template-columns:repeat(3,1fr)"></div>
    <div class="slist" id="slist"></div>
    <table class="grid" id="sgrid"></table>
  </section>

  <!-- 상세 시트 -->
  <div class="sheet-bg" id="sheetbg" onclick="closeSheet()"></div>
  <div class="sheet" id="sheet"><div class="grip"></div><div id="sheetbody"></div></div>

  <!-- 실행 -->
  <section class="view" id="v-run">
    <div class="card"><h3>작업 실행</h3>
      <div class="actions">
        <button class="abtn primary" onclick="runTask('daily')"><span class="em">▶</span>전체 대조</button>
        <button class="abtn" onclick="runTask('synthetic')"><span class="em">🧪</span>합성검증</button>
        <button class="abtn" onclick="runTask('kakao')"><span class="em">💬</span>카톡 대조</button>
        <button class="abtn" onclick="runTask('erp_ledger')"><span class="em">🧾</span>ERP원장 대조</button>
        <button class="abtn" onclick="runTask('po')"><span class="em">📦</span>쿠팡 PO 대조</button>
        <button class="abtn" onclick="runTask('writer_prev')"><span class="em">✏</span>자동입력 미리보기</button>
        <button class="abtn" onclick="confirmRun('writer_apply','확정 대기 항목을 관리대장 새 버전(vN+1)에 입력합니다.\n빈 칸만 채우며 이전 버전은 보존됩니다.')"><span class="em">✏</span>자동입력 반영</button>
        <button class="abtn" onclick="runTask('upload_dry')"><span class="em">📤</span>전표 전송대기</button>
        <button class="abtn danger" onclick="confirmRun('upload_post','⚠ 이카운트 ERP에 매출전표를 실제 등록합니다.\n(10.5초/건, 이중계상 가드 적용)')"><span class="em">🚀</span>전표 실전송</button>
      </div>
      <div class="logbox" id="logbox">대기 중 — 작업을 실행하면 로그가 여기 표시됩니다.</div></div>
  </section>

  <!-- 리포트 -->
  <section class="view" id="v-report">
    <div class="rtabs" id="rtabs"></div>
    <div class="md" id="mdbox">리포트 로딩...</div>
  </section>

</main>

<nav class="tabbar" id="tabbar">
  <div class="brand">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.5 12h-11z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/></svg></div>
    <div class="bt">쿠팡 통합업무<small>UNIVERSAL LIFT ERP</small></div>
  </div>
  <button class="on" data-v="dash" onclick="show('dash')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>대시보드</button>
  <button data-v="settle" onclick="show('settle')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>정산</button>
  <button data-v="run" onclick="show('run')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="6,4 20,12 6,20"/></svg>실행</button>
  <button data-v="report" onclick="show('report')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>리포트</button>
</nav>

<script>
let PIN = localStorage.getItem('cw_pin') || '';
let settleRows = [], reports = [], curReport = 0, polling = null;

const $ = id => document.getElementById(id);
const fmt = n => (n==null||n==='')?'-':Number(n).toLocaleString('ko-KR');
async function api(path, opt={}){
  opt.headers = Object.assign({'X-Pin': PIN}, opt.headers||{});
  const r = await fetch(path, opt);
  if(r.status===401){
    PIN=''; localStorage.removeItem('cw_pin');   // 구 PIN 즉시 폐기 → 자동 폴링 중단(자기 잠금 방지)
    $('gate').style.display='flex'; throw 'PIN';
  }
  return r.json();
}
async function login(){
  const pin = $('pin').value.trim();
  const r = await fetch('/api/login',{method:'POST',body:JSON.stringify({pin})});
  if(r.ok){ PIN=pin; localStorage.setItem('cw_pin',pin); $('gate').style.display='none'; refreshAll(); }
  else if(r.status===429) $('pinerr').textContent = '시도 초과로 잠금 — 10분 후 다시 시도하세요';
  else $('pinerr').textContent = 'PIN이 올바르지 않습니다';
}
$('pin').addEventListener('keyup',e=>{ if(e.key==='Enter'||$('pin').value.length===4) login(); });

function show(v){
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
  $('v-'+v).classList.add('active');
  document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('on', b.dataset.v===v));
  if(v==='report' && !reports.length) loadReports();
}

/* ── 대시보드 ── */
async function loadStatus(){
  const s = await api('/api/status');
  $('demobadge').textContent = s.demo ? '· 데모(합성데이터)' : '';
  const rows = settleRows.length ? settleRows : [];
  const 유상 = rows.filter(r=>r.비용구분==='유상');
  const 발행 = 유상.filter(r=>r.계산서==='발행').length;
  const 미수 = rows.reduce((a,r)=>a+(+r.미수금||0),0);
  const issues = rows.filter(r=>!['정상','무상/보험'].includes(r.상태));
  const asOpen = (works.as||[]).filter(r=>r.진행상태 && r.진행상태!=='작업완료').length;
  const pmWait = (works.pm||[]).filter(r=>r.점검상태 && r.점검상태!=='완료').length;
  const tile=(cls,ico,label,val,sub)=>`<div class="kpi ${cls}">
    <div class="head"><div class="ico">${ico}</div><div class="l">${label}</div></div>
    <div class="v">${val}</div>${sub?`<div class="s">${sub}</div>`:''}</div>`;
  $('kpis').innerHTML =
    tile('accent','📋','정산 건수', rows.length||'-', `유상 ${유상.length}건`) +
    tile('','💰','공급가액 합계', fmt(rows.reduce((a,r)=>a+(+r.공급가액||0),0)), '원') +
    tile(미수?'warn':'ok','⏳','미수금', fmt(미수), '원') +
    tile(발행===유상.length&&유상.length?'ok':'','🧾','계산서 발행율',
      (유상.length?Math.round(발행/유상.length*100):0)+'%',
      `${발행}/${유상.length}건 <span class="bar"><i style="width:${유상.length?발행/유상.length*100:0}%"></i></span>`) +
    tile(issues.length?'danger':'ok','⚠️','정산 조치 필요', issues.length, issues.length?'클릭해 아래 유형 확인':'모두 정상') +
    tile(asOpen?'warn':'','🔧','AS · 점검', `${asOpen} · ${pmWait}`, 'AS 진행중 · 점검 대기');
  // 상태 분포 바 (2px 간격 마크)
  const SCOLOR = {'정상':'#12813F','입금 대기':'#B54708','세금계산서 미발행':'#C0212E',
    '미청구(전표 없음)':'#8B1E68','금액 미입력':'#5B6B82','무상/보험':'#B9C3D3'};
  const dist = {};
  rows.forEach(r=>{ dist[r.상태]=(dist[r.상태]||0)+1; });
  const entries = Object.entries(dist).sort((a,b)=>b[1]-a[1]);
  $('distbar').innerHTML = entries.map(([k,v])=>
    `<i style="flex:${v};background:${SCOLOR[k]||'#5B6B82'}" title="${k} ${v}건"></i>`).join('');
  $('distlegend').innerHTML = entries.map(([k,v])=>
    `<span><b style="background:${SCOLOR[k]||'#5B6B82'}"></b>${k} ${v}</span>`).join('');
  // 조치 필요 TOP: 유형별 집계 + 상위 건
  const byType = {};
  issues.forEach(r=>{ (byType[r.상태]=byType[r.상태]||[]).push(r); });
  $('toplist').innerHTML = Object.entries(byType).sort((a,b)=>b[1].length-a[1].length).map(([t,list])=>{
    const amt = list.reduce((a,r)=>a+(+r.공급가액||0),0);
    return `<div class="topitem" onclick="jumpIssue('${t}')"><span><b>${t}</b><br>
      <span style="color:var(--muted);font-size:11.5px">${list.slice(0,3).map(r=>r.정산ID).join(', ')}${list.length>3?' 외':''}</span></span>
      <span style="text-align:right"><b>${list.length}건</b><br><span style="font-size:11.5px;color:var(--muted)">${fmt(amt)}원</span></span></div>`;
  }).join('') || '<div style="color:var(--muted);font-size:13px">조치 필요 건이 없습니다 🎉</div>';
  $('agentTime').textContent = '— ' + (s.agent_last||'');
  const icon = {ok:'✅',skip:'⏭',fail:'❌'};
  $('steps').innerHTML = (s.steps||[]).map(t=>`<div class="step"><span class="ic">${icon[t.s]||'·'}</span>${t.n}</div>`).join('') || '<span style="color:var(--muted)">아직 실행 기록 없음</span>';
  if(s.fork && s.fork.length){ $('forkcard').style.display='block';
    $('forkmsg').textContent = `구버전 ${s.fork.join(', ')} 이 최신본보다 나중에 수정되었습니다. 잘못된 파일에 입력 중일 수 있으니 확인하세요.`; }
  else $('forkcard').style.display='none';
  if(s.tunnel){ $('tunnelcard').style.display='block';
    $('tunnelurl').textContent = s.tunnel; $('tunnelurl').href = s.tunnel; }
  else $('tunnelcard').style.display='none';
}

/* ── 정산·업무 ── */
let works = {as:[], pm:[]}, mode = 'settle', issuesData = {rows:[],cols:[]}, checks = {};
async function loadSettle(){
  const d = await api('/api/settlements');
  settleRows = d.rows||[];
  try{ works = await api('/api/works'); }catch(e){}
  try{ issuesData = await api('/api/issues'); }catch(e){}
  try{ checks = await api('/api/checks'); }catch(e){}
  fillStatOptions(); renderSettle();
}
function setMode(m){
  mode = m;
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on', b.dataset.m===m));
  fillStatOptions(); renderSettle();
}
function jumpIssue(t){
  show('settle'); mode='settle';
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on', b.dataset.m==='settle'));
  fillStatOptions(); $('fstat').value = t; renderSettle();
}
function curRows(){
  if(mode==='as') return works.as||[];
  if(mode==='pm') return works.pm||[];
  if(mode==='check') return issuesData.rows||[];
  return settleRows;
}
function statOf(r){ return mode==='as' ? r.진행상태 : mode==='pm' ? r.점검상태 :
  mode==='check' ? (r.문제유형||r.검증결과||r.우선순위||'확인필요') : r.상태; }
function vbadge(id){
  const c = checks[id]; if(!c) return '';
  const one = (label,v)=>{ if(!v) return '';
    const good = v.startsWith('확인')||v==='일치';
    return `<span class="chip ${good?'c-ok':'c-danger'}" style="font-size:10px">${label} ${good?'✓':'✗'}</span>`; };
  return one('카톡',c.kakao)+one('밴드',c.band)+(c.erp?`<span class="chip c-warn" style="font-size:10px">ERP ${c.erp.slice(0,14)}</span>`:'');
}
function fillStatOptions(){
  const stats = [...new Set(curRows().map(statOf).filter(Boolean))];
  $('fstat').innerHTML = '<option value="">상태 전체</option>' + stats.map(s=>`<option>${s}</option>`).join('');
}
function chip(st){
  const ok=['정상','작업완료','완료','없음'], warn=['입금 대기','방문예정','작업중','예정','접수'];
  const cls = ok.includes(st)?'c-ok': st==='무상/보험'?'c-skip': warn.includes(st)?'c-warn':'c-danger';
  return `<span class="chip ${cls}">${st||'-'}</span>`;
}
function renderSettle(){
  const q = ($('q').value||'').toLowerCase(), f = $('fstat').value;
  const rows = curRows().filter(r =>
    (!f || statOf(r)===f) &&
    (!q || Object.values(r).join('').toLowerCase().includes(q)));
  if(mode==='settle'){
    const need = rows.filter(r=>!['정상','무상/보험'].includes(r.상태));
    const 미수 = rows.reduce((a,r)=>a+(+r.미수금||0),0);
    $('skpis').innerHTML = `
      <div class="kpi accent"><div class="v">${fmt(rows.reduce((a,r)=>a+(+r.공급가액||0),0))}</div><div class="l">공급가액(원)</div></div>
      <div class="kpi ${미수?'warn':''}"><div class="v">${fmt(미수)}</div><div class="l">미수금(원)</div></div>
      <div class="kpi ${need.length?'danger':''}"><div class="v">${need.length}/${rows.length}</div><div class="l">조치 필요</div></div>`;
    $('slist').innerHTML = rows.map((r,i)=>`
      <div class="srow" onclick="openSheet('settle',${i},'${r.정산ID}')">
        <div class="top"><span class="id">${r.정산ID}</span>${chip(r.상태)}</div>
        <div class="top"><span class="camp">${r.캠프명} · ${r.업무구분}</span><span class="amt">${fmt(r.공급가액)}원</span></div>
        <div class="meta"><span>${r.프로젝트NO}</span><span>완료 ${r.완료일||'-'}</span>
          <span>명세서 ${r.명세서번호||r.명세서}</span><span>계산서 ${r.계산서}</span>
          ${r.입금일?`<span>입금 ${r.입금일}</span>`:''} ${vbadge(r.정산ID)}</div>
      </div>`).join('') || '<div class="card">조건에 맞는 건이 없습니다</div>';
    $('sgrid').innerHTML = `<tr><th>정산ID</th><th>구분</th><th>캠프</th><th>프로젝트</th>
      <th class="num">공급가액</th><th>명세서번호</th><th>계산서</th><th>입금일</th><th class="num">미수금</th><th>완료일</th><th>상태</th></tr>` +
      rows.map((r,i)=>`<tr onclick="openSheet('settle',${i},'${r.정산ID}')" style="cursor:pointer">
        <td><b>${r.정산ID}</b></td><td>${r.업무구분}</td><td>${r.캠프명}</td>
        <td>${r.프로젝트NO}</td><td class="num">${fmt(r.공급가액)}</td><td>${r.명세서번호||'-'}</td>
        <td>${r.계산서}${r.계산서발행일?' '+r.계산서발행일:''}</td><td>${r.입금일||'-'}</td>
        <td class="num">${r.미수금===''?'-':fmt(r.미수금)}</td><td>${r.완료일||'-'}</td><td>${chip(r.상태)}</td></tr>`).join('');
  } else if(mode==='as'){
    const done = rows.filter(r=>r.진행상태==='작업완료').length;
    $('skpis').innerHTML = `
      <div class="kpi accent"><div class="v">${rows.length}</div><div class="l">접수 건수</div></div>
      <div class="kpi"><div class="v">${done}</div><div class="l">작업완료</div></div>
      <div class="kpi ${rows.length-done?'warn':''}"><div class="v">${rows.length-done}</div><div class="l">진행중</div></div>`;
    $('slist').innerHTML = rows.map((r,i)=>`
      <div class="srow" onclick="openSheet('as',${i},'${r.접수ID}')">
        <div class="top"><span class="id">${r.접수ID}</span>${chip(r.진행상태)}</div>
        <div class="top"><span class="camp">${r.캠프명}</span><span class="camp">${r.담당기사||'-'}</span></div>
        <div class="meta"><span>접수 ${r.접수일자||'-'}</span><span>${r['유상·무상·보험']||''}</span>
          ${r.긴급도==='긴급'?'<span style="color:var(--danger);font-weight:700">긴급</span>':''}
          <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.신청내용||''}</span></div>
      </div>`).join('') || '<div class="card">조건에 맞는 건이 없습니다</div>';
    $('sgrid').innerHTML = `<tr><th>접수ID</th><th>캠프</th><th>접수일</th><th>기사</th><th>유·무상</th><th>내용</th><th>완료일</th><th>상태</th></tr>` +
      rows.map((r,i)=>`<tr onclick="openSheet('as',${i},'${r.접수ID}')" style="cursor:pointer">
        <td><b>${r.접수ID}</b></td><td>${r.캠프명}</td><td>${r.접수일자||'-'}</td><td>${r.담당기사||'-'}</td>
        <td>${r['유상·무상·보험']||'-'}</td><td style="max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.신청내용||''}</td>
        <td>${r.작업완료일||'-'}</td><td>${chip(r.진행상태)}</td></tr>`).join('');
  } else if(mode==='check'){
    // 엑셀 07_불일치누락현황 — 검증 안 된·확인해야 할 항목 그대로
    const types = {};
    rows.forEach(r=>{ const t=statOf(r); types[t]=(types[t]||0)+1; });
    $('skpis').innerHTML = `
      <div class="kpi danger"><div class="v">${rows.length}</div><div class="l">확인필요 건수</div></div>
      <div class="kpi"><div class="v">${Object.keys(types).length}</div><div class="l">문제 유형 수</div></div>
      <div class="kpi"><div class="v">${(issuesData.cols||[]).length}</div><div class="l">검증 항목(열)</div></div>`;
    const keyOf = r => r.업무ID||r.정산ID||r.접수ID||Object.values(r)[0]||'';
    const descOf = r => r.문제내용||r.경고내용||r.검증문제코드||r.누락서류||'';
    $('slist').innerHTML = rows.map((r,i)=>`
      <div class="srow" onclick="openSheet('check',${i},'${keyOf(r)}')">
        <div class="top"><span class="id">${keyOf(r)}</span>${chip(statOf(r))}</div>
        <div class="top"><span class="camp">${r.캠프명||''}</span><span class="camp">${r.담당자||r.담당기사||''}</span></div>
        <div class="meta"><span style="flex:1">${descOf(r)}</span></div>
      </div>`).join('') || '<div class="card">확인필요 항목이 없습니다 🎉</div>';
    const cols = (issuesData.cols||[]).filter(c=>rows.some(r=>r[c])).slice(0,9);
    $('sgrid').innerHTML = `<tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr>` +
      rows.map((r,i)=>`<tr onclick="openSheet('check',${i},'${keyOf(r)}')" style="cursor:pointer">${
        cols.map(c=>`<td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r[c]||'-'}</td>`).join('')}</tr>`).join('');
  } else {
    const done = rows.filter(r=>r.점검상태==='완료').length;
    $('skpis').innerHTML = `
      <div class="kpi accent"><div class="v">${rows.length}</div><div class="l">점검 건수</div></div>
      <div class="kpi"><div class="v">${done}</div><div class="l">완료</div></div>
      <div class="kpi ${rows.length-done?'warn':''}"><div class="v">${rows.length-done}</div><div class="l">예정·미점검</div></div>`;
    $('slist').innerHTML = rows.map((r,i)=>`
      <div class="srow" onclick="openSheet('pm',${i},'${r.점검ID}')">
        <div class="top"><span class="id">${r.점검ID}</span>${chip(r.점검상태)}</div>
        <div class="top"><span class="camp">${r.캠프명}</span><span class="camp">${r.담당기사||'-'}</span></div>
        <div class="meta"><span>예정 ${r.점검예정일||'-'}</span><span>실제 ${r.실제점검일||'-'}</span>
          ${r.이상발견여부==='있음'?'<span style="color:var(--danger);font-weight:700">이상발견</span>':''}</div>
      </div>`).join('') || '<div class="card">조건에 맞는 건이 없습니다</div>';
    $('sgrid').innerHTML = `<tr><th>점검ID</th><th>캠프</th><th>예정일</th><th>실제점검일</th><th>기사</th><th>이상</th><th>AS전환</th><th>상태</th></tr>` +
      rows.map((r,i)=>`<tr onclick="openSheet('pm',${i},'${r.점검ID}')" style="cursor:pointer">
        <td><b>${r.점검ID}</b></td><td>${r.캠프명}</td><td>${r.점검예정일||'-'}</td><td>${r.실제점검일||'-'}</td>
        <td>${r.담당기사||'-'}</td><td>${r.이상발견여부||'-'}</td><td>${r.돌발AS전환여부||'-'}</td><td>${chip(r.점검상태)}</td></tr>`).join('');
  }
  window._lastRows = rows;
}

/* ── 상세 시트 ── */
function openSheet(kind, idx, id){
  const r = (window._lastRows||[])[idx];
  if(!r) return;
  let html = '';
  if(kind==='settle'){
    html = `<h2>${r.정산ID} ${chip(r.상태)}</h2><div class="sub">${r.캠프명} · ${r.업무구분} · ${r.프로젝트NO}</div>
    <div class="dl">
      <div class="sec">작업</div>
      <dt>원천업무</dt><dd>${r.원천업무ID||'-'}</dd>
      <dt>작업완료일</dt><dd>${r.완료일||'-'}</dd>
      <dt>비용구분</dt><dd>${r.비용구분||'-'}</dd>
      <dt>공급가액</dt><dd>${fmt(r.공급가액)}원</dd>
      <dt>합계(VAT포함)</dt><dd>${fmt(r.합계)}원</dd>
      <div class="sec">쿠팡 PO</div>
      <dt>PO 필요여부</dt><dd>${r.PO필요||'-'}</dd>
      <dt>PO 번호</dt><dd>${r.PO번호||'없음'}</dd>
      <dt>PO 발행일</dt><dd>${r.PO발행일||'-'}</dd>
      <div class="sec">거래명세서 / ERP</div>
      <dt>명세서번호</dt><dd>${r.명세서번호||'없음'}</dd>
      <dt>발행일</dt><dd>${r.명세서발행일||'-'}</dd>
      <div class="sec">세금계산서</div>
      <dt>발행여부</dt><dd>${r.계산서}</dd>
      <dt>발행일</dt><dd>${r.계산서발행일||'-'}</dd>
      <dt>승인번호</dt><dd>${r.승인번호||'-'}</dd>
      <div class="sec">수금</div>
      <dt>입금일</dt><dd>${r.입금일||'-'}</dd>
      <dt>입금액</dt><dd>${r.입금액?fmt(r.입금액)+'원':'-'}</dd>
      <dt>미수금</dt><dd>${r.미수금===''?'-':fmt(r.미수금)+'원'}</dd>
      <div class="sec">3원천 검증 (카톡·밴드·ERP)</div>
      <dt>대조결과</dt><dd>${vbadge(r.정산ID)||'대조 데이터 없음 — inbox에 파일을 넣고 대조를 실행하세요'}</dd>
    </div>
    ${inputForm(r)}`;
  } else {
    html = `<h2>${id} ${chip(statOf(r))}</h2><div class="sub">${r.캠프명||''}</div><div class="dl">` +
      Object.entries(r).map(([k,v])=>`<dt>${k}</dt><dd>${v||'-'}</dd>`).join('') + '</div>';
  }
  $('sheetbody').innerHTML = html;
  $('sheetbg').style.display='block';
  requestAnimationFrame(()=>$('sheet').classList.add('open'));
}
function closeSheet(){
  $('sheet').classList.remove('open');
  setTimeout(()=>$('sheetbg').style.display='none', 220);
}

/* ── 앱 → 엑셀 입력 (빈 칸만, ledger_writer 큐 경유) ── */
const INPUT_FIELDS = [
  {label:'PO번호', col:'PO번호', vtype:'text', cur:r=>r.PO번호, ph:'예: PO367787'},
  {label:'PO발행일', col:'PO발행일', vtype:'date', cur:r=>r.PO발행일, ph:'YYYY-MM-DD'},
  {label:'명세서번호', col:'거래명세서번호', vtype:'text',  cur:r=>r.명세서번호, ph:'예: 2026/07/24-1'},
  {label:'명세서발행일', col:'거래명세서발행일', vtype:'date', cur:r=>r.명세서발행일, ph:'YYYY-MM-DD'},
  {label:'세금계산서발행일', col:'세금계산서발행일', vtype:'date', cur:r=>r.계산서발행일, ph:'YYYY-MM-DD'},
  {label:'입금일', col:'입금일', vtype:'date', cur:r=>r.입금일, ph:'YYYY-MM-DD'},
  {label:'입금액', col:'입금액', vtype:'number', cur:r=>r.입금액, ph:'숫자만'},
];
function inputForm(r){
  const empty = INPUT_FIELDS.filter(f=>!f.cur(r));
  if(!empty.length) return '';
  return `<div class="sec" style="border-top:1px solid var(--line);margin-top:14px;padding-top:12px;
    font-size:12px;font-weight:800;color:var(--primary-dk)">빈 항목 입력 → 엑셀 반영 (빈 칸만 채워짐·새 버전 생성)</div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">` +
    empty.map((f,i)=>`<div style="display:flex;gap:8px;align-items:center">
      <span style="width:110px;font-size:12.5px;color:var(--muted);font-weight:600">${f.label}</span>
      <input id="inp_${i}" placeholder="${f.ph}" data-col="${f.col}" data-vtype="${f.vtype}"
        style="flex:1;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:14px">
    </div>`).join('') +
    `</div><button onclick="saveInputs('${r.정산ID}',${empty.length})" style="margin-top:10px;width:100%;
      padding:12px;background:var(--primary);color:#fff;border-radius:11px;font-weight:700;font-size:14px">입력 저장 (자동입력 큐 적재)</button>
    <div style="font-size:11px;color:var(--muted);margin-top:6px">저장 후 [실행]탭 → 자동입력 반영을 누르거나, 09:50 에이전트가 자동 반영합니다.</div>`;
}
async function saveInputs(sid, n){
  let queued = 0;
  for(let i=0;i<n;i++){
    const el = $('inp_'+i);
    if(!el || !el.value.trim()) continue;
    const body = {sheet:'06_거래서류청구수금', key_col:'정산ID', key:sid,
      col:el.dataset.col, value:el.value.trim(), vtype:el.dataset.vtype};
    if(el.dataset.col==='입금일'||el.dataset.col==='입금액'){ /* 16시트에도 동일 키 존재 — 06 기준 유지 */ }
    const r = await api('/api/input',{method:'POST',body:JSON.stringify(body)});
    if(r.ok) queued++;
  }
  alert(queued ? `${queued}건 큐 적재 완료 — 자동입력 반영 시 엑셀 새 버전(vN+1)에 기록됩니다.` : '입력된 값이 없습니다');
  if(queued){ closeSheet(); loadStatus(); }
}

/* ── 실행 ── */
function confirmRun(key,msg){ if(confirm(msg+'\n\n진행할까요?')) runTask(key); }
async function runTask(key){
  show('run');
  const r = await api('/api/run/'+key,{method:'POST'});
  if(!r.ok && r.msg!=='demo'){ alert(r.msg); return; }
  if(!polling) polling = setInterval(pollLog, 1200);
  pollLog();
}
async function pollLog(){
  const d = await api('/api/tasklog');
  $('livedot').className = 'dot' + (d.busy?' busy':'');
  if(d.log.length) { $('logbox').textContent = d.log.join('\n'); $('logbox').scrollTop = 1e9; }
  if(!d.busy && polling){ clearInterval(polling); polling=null; loadStatus(); loadSettle(); }
}

/* ── 리포트 ── */
function mdRender(t){
  const esc = s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  let html='', intbl=false;
  for(const ln of t.split('\n')){
    if(/^\|/.test(ln)){
      if(/^\|[\s\-|]+\|$/.test(ln)) continue;
      const cells = ln.split('|').slice(1,-1).map(c=>esc(c.trim()));
      if(!intbl){ html+='<table><tr>'+cells.map(c=>`<th>${c}</th>`).join('')+'</tr>'; intbl=true; }
      else html+='<tr>'+cells.map(c=>`<td>${c}</td>`).join('')+'</tr>';
      continue;
    }
    if(intbl){ html+='</table>'; intbl=false; }
    if(/^# /.test(ln)) html+=`<h1>${esc(ln.slice(2))}</h1>`;
    else if(/^## /.test(ln)) html+=`<h2>${esc(ln.slice(3))}</h2>`;
    else if(/^- /.test(ln)) html+=`<li>${esc(ln.slice(2))}</li>`;
    else if(ln.trim()) html+=`<p>${esc(ln)}</p>`;
  }
  if(intbl) html+='</table>';
  return html;
}
async function loadReports(){
  const d = await api('/api/reports');
  reports = d.reports||[];
  $('rtabs').innerHTML = reports.map((r,i)=>`<button class="${i===curReport?'on':''}" onclick="pickReport(${i})">${r.kind}</button>`).join('') || '';
  pickReport(Math.min(curReport, Math.max(0,reports.length-1)));
}
function pickReport(i){
  curReport=i;
  document.querySelectorAll('#rtabs button').forEach((b,j)=>b.classList.toggle('on',j===i));
  $('mdbox').innerHTML = reports[i] ? mdRender(reports[i].text) : '리포트가 아직 없습니다';
}

/* ── 부트 ── */
function tick(){ $('clock').textContent = new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}); }
async function refreshAll(){ try{ await loadSettle(); await loadStatus(); }catch(e){} }
(async function(){
  tick(); setInterval(tick, 30000);
  if(PIN){ $('gate').style.display='none'; refreshAll(); }
  setInterval(()=>{ if(PIN && !runnerBusy()) loadStatus().catch(()=>{}); }, 30000);
})();
function runnerBusy(){ return !!polling; }
</script>
