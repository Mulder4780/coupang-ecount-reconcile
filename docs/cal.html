      <button onclick="shiftDay(1)">다음날 ›</button></div>
  </div>
</div>
<script>
/* 공유 전용 캘린더 (2026-08-06 지시)
   ─────────────────────────────────────────────────────────────────────────
   · 열쇠는 주소의 `#k=` 에 있다. `#` 뒤는 **서버로 가지 않는다** — 깃허브 접속
     기록에도 남지 않고 검색엔진도 못 가져간다. 그래서 PIN 을 묻지 않아도 된다.
   · 여기서 푸는 것은 **캘린더 자물쇠**다. 앱 PIN 이 아니므로 이 링크로는 정산·
     계산서·확인필요가 열리지 않는다. 링크가 새어도 새는 것은 일정뿐이다.
   · 주소는 **고정**이다. 열쇠를 새로 뽑지 않는 한(`cal_share.py --new-key`)
     한 번 보낸 링크가 계속 같은 자리를 연다. */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KSTORE = 'csos.cal.k';

async function unseal(enc, pass){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass),
                                           'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits(
    {name:'PBKDF2', salt:b64(enc.salt), iterations:enc.iter, hash:'SHA-256'}, km, 512));
  const iv = b64(enc.iv), ct = b64(enc.ct);
  const hk = await crypto.subtle.importKey('raw', bits.slice(32,64),
                                           {name:'HMAC', hash:'SHA-256'}, false, ['verify']);
  const signed = new Uint8Array(iv.length + ct.length);
  signed.set(iv); signed.set(ct, iv.length);
  if(!(await crypto.subtle.verify('HMAC', hk, b64(enc.tag), signed))) throw new Error('KEY');
  const ck = await crypto.subtle.importKey('raw', bits.slice(0,32), {name:'AES-CBC'}, false, ['decrypt']);
  const pt = new Uint8Array(await crypto.subtle.decrypt({name:'AES-CBC', iv}, ck, ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

let CAL = {일정:[], 분류목록:[]}, M = '', DAY = '', OFF = new Set(), SEL = 0;
const kindOf = k => (CAL.분류목록||[]).find(x => x.key === k)
  || {key:k, label:k||'기타', color:'#8E8E93'};
const campOf = e => String(e.캠프명 || e.장소 || e.제목 || '').trim() || '(장소 미입력)';
const isoOf = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')
                 + '-'+String(d.getDate()).padStart(2,'0');

/* ── 카카오톡·밴드 같은 '앱 안 브라우저'에서는 설치가 아예 안 된다 ──────────
   (2026-08-06 지시: "캘린더 공유시 크롬을 자동으로 열어서 설치하게끔")
   왜 이 장치가 필요한가 — 단톡방에서 링크를 누르면 카카오톡 **안**의 브라우저가 뜬다.
   그 브라우저에는 '홈 화면에 추가' 도 없고 설치 창(beforeinstallprompt)도 없다.
   그래서 아무리 잘 만들어도 현장 기사 폰에는 아이콘이 안 생긴다. 링크를 매번 찾아야 하고,
   그러다 안 보게 된다. → **크롬으로 넘겨 준 다음** 거기서 설치를 권한다.
   · 안드로이드: `intent://…#k=…#Intent;scheme=https;package=com.android.chrome;end`
     안드로이드는 **맨 뒤** `#Intent;` 부터를 명령으로 읽어서 앞의 `#k=` 는 주소에 남는다.
     열쇠를 잃지 않고 그대로 크롬으로 넘어간다.
   · 아이폰: **사파리**로 넘긴다(`x-safari-`). 크롬이 아니다 — 아이폰 크롬은 홈 화면
     설치를 못 하기 때문이다. 사파리에서 '공유 → 홈 화면에 추가' 안내까지 이어 준다.
   · 어느 쪽이든 **넘기기 전에 주소를 클립보드에 복사**해 둔다. 넘어가다 실패해도
     '붙여넣기' 한 번으로 살아난다. */
function inAppBrowser(){
  const u = navigator.userAgent || '';
  return /KAKAOTALK|BAND|NAVER\(inapp|DaumApps|Instagram|FBAN|FBAV|Line\//i.test(u);
}
function isAndroid(){ return /Android/i.test(navigator.userAgent||''); }
function isIOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent||'') && !window.MSStream; }
function standalone(){
  return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
}
function shareUrl(){
  const k = currentKey();
  return location.origin + location.pathname + (k ? '#k=' + k : '');
}
/* 넘길 주소를 **만들기만** 하는 함수 — 실제로 넘기는 것은 openInChrome 이다.
   나눠 둔 이유: 주소 규칙이 틀리면 링크를 받은 사람 폰에서만 조용히 실패한다.
   여기서 문자열로 뽑아낼 수 있어야 검증[120]이 규칙을 지켜 준다. */
function chromeJumpUrl(){
  const url = shareUrl();
  const rest = location.host + location.pathname + (currentKey() ? '#k=' + currentKey() : '');
  if(isAndroid()){
    // 안드로이드는 **맨 뒤** `#Intent;` 부터를 명령으로 읽는다. 그래서 앞의 `#k=` 는
    // 주소에 그대로 남아 크롬으로 넘어간다(열쇠를 잃지 않는다).
    // 크롬이 없는 폰은 fallback 주소로 되돌아온다 — 아무 데도 못 가는 일은 없다.
    return 'intent://' + rest
      + '#Intent;scheme=https;package=com.android.chrome;'
      + 'S.browser_fallback_url=' + encodeURIComponent(url) + ';end';
  }
  /* ★ 아이폰은 크롬으로 보내면 안 된다 — **아이폰 크롬은 홈 화면 설치를 못 한다.**
     아이폰에서 홈 화면에 아이콘을 만들 수 있는 것은 사파리뿐이다. 크롬으로 넘기면
     "열리기는 하는데 설치는 여전히 안 되는" 상태가 되어 한 걸음 헛돈다.
     그래서 사파리로 보낸다(`x-safari-` 는 카카오톡 안 브라우저에서 사파리를 여는 주소다). */
  if(isIOS()) return 'x-safari-' + shareUrl();
  return '';
}
function openInChrome(){
  // 넘어가다 실패해도 살아날 수 있게 **먼저** 주소를 복사해 둔다.
  try{ navigator.clipboard && navigator.clipboard.writeText(shareUrl()); }catch(e){}
  const to = chromeJumpUrl();
  if(!to) return false;
  location.href = to;
  return true;
}
function dismissBar(){ const b = $('cbar'); if(b) b.remove(); }
function showBar(kind){
  dismissBar();
  const bar = document.createElement('div');
  bar.className = 'bar'; bar.id = 'cbar';
  if(kind === 'chrome'){
    const ios = isIOS();
    bar.innerHTML = '<b>' + (ios ? '사파리에서 열면' : '크롬에서 열면') + ' 앱으로 설치됩니다</b>'
      + '<p>지금은 카카오톡·밴드 안의 브라우저라 홈 화면에 아이콘을 만들 수 없습니다. '
      + (ios ? '사파리' : '크롬') + '으로 열면 다음부터 링크를 찾지 않아도 됩니다.</p>'
      + '<span class="row"><button class="go" id="cgo">'
      + (ios ? '사파리로 열기' : '크롬으로 열기') + '</button>'
      + '<button class="no" id="cno">나중에</button></span>';
  }else if(kind === 'ios'){
    bar.innerHTML = '<b>홈 화면에 캘린더 아이콘 만들기</b>'
      + '<p>아래 <b>공유</b> 버튼 → <b>홈 화면에 추가</b> 를 누르면 앱처럼 열립니다. '
      + '(아이폰은 사파리에서만 됩니다)</p>'
      + '<span class="row"><button class="no" id="cno" style="flex:1">알겠습니다</button></span>';
  }else{
    bar.innerHTML = '<b>쿠팡 캘린더를 앱으로 설치</b>'
      + '<p>홈 화면에서 바로 열 수 있습니다. 링크를 다시 찾지 않아도 됩니다.</p>'
      + '<span class="row"><button class="go" id="cgo">설치하기</button>'
      + '<button class="no" id="cno">나중에</button></span>';
  }
  document.body.appendChild(bar);
  const no = $('cno');
  if(no) no.onclick = () => { try{ localStorage.setItem('csos.cal.hint','off'); }catch(e){} dismissBar(); };
  const go = $('cgo');
  if(go) go.onclick = () => { if(kind === 'chrome'){ openInChrome(); } else { doInstall(); } };
}
let PROMPT = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault(); PROMPT = e;
  const b = $('binstall'); if(b) b.hidden = false;
  if(!standalone() && !hintOff()) showBar('install');
});
function hintOff(){ try{ return localStorage.getItem('csos.cal.hint') === 'off'; }catch(e){ return false; } }
async function doInstall(){
  dismissBar();
  if(!PROMPT) return;
  try{ PROMPT.prompt(); await PROMPT.userChoice; }catch(e){}
  PROMPT = null;
  const b = $('binstall'); if(b) b.hidden = true;
}
/* 크롬으로 넘기는 판단은 **자료를 다 그린 뒤**에 한다 — 화면이 비어 있는 채로
   다른 앱으로 튀면 사람은 링크가 깨졌다고 본다. */
function offerInstall(){
  if(standalone() || hintOff()) return;
  if(inAppBrowser()){
    showBar('chrome');
    // "자동으로 열어서" — 한 번만 스스로 시도한다. 실패하거나 사람이 돌아오면 위 띠가 남는다.
    let tried = false;
    try{ tried = sessionStorage.getItem('csos.cal.jump') === '1'; }catch(e){}
    if(!tried){
      try{ sessionStorage.setItem('csos.cal.jump','1'); }catch(e){}
      setTimeout(openInChrome, 700);
    }
    return;
  }
  if(isIOS()) setTimeout(() => { if(!hintOff()) showBar('ios'); }, 1200);
  // 안드로이드 크롬은 beforeinstallprompt 가 오면 그때 띠를 띄운다(위 리스너).
}

/* ── 날짜 창 ─────────────────────────────────────────────────────────── */
function dayRows(){
  return (CAL.일정||[]).filter(e => e.날짜 === DAY && !OFF.has(String(e.분류||'etc')));
}
function openSheet(){
  const w = $('sheet'); if(!w) return;
  renderSheet();
  if(!w.classList.contains('open')){
    document.body.style.overflow = 'hidden';
    w.classList.add('open');
    // rAF 만 믿지 않는다 — 탭이 숨으면 rAF 는 아예 안 불린다. 시간으로도 같이 건다.
    const rise = () => w.classList.add('in');
    requestAnimationFrame(rise); setTimeout(rise, 60);
  }
}
function closeSheet(){
  const w = $('sheet'); if(!w || !w.classList.contains('open')) return;
  w.classList.remove('in'); document.body.style.overflow = '';
  setTimeout(() => w.classList.remove('open'), 280);
}
function shiftDay(n){
  if(!DAY) return;
  const [y,m,d] = DAY.split('-').map(Number);
  const t = new Date(y, m-1, d+n);
  DAY = isoOf(t); SEL = 0;
  if(DAY.slice(0,7) !== M) M = DAY.slice(0,7);
  render(); renderSheet();
}
function pickEvent(i){ SEL = i; renderSheet(); }
function renderSheet(){
  const body = $('sheetBody'), title = $('sheetTitle'), sub = $('sheetSub');
  if(!body) return;
  const rows = dayRows();
  title.textContent = DAY || '선택한 날';
  sub.textContent = rows.length ? '일정 ' + rows.length + '건' : '이 날에는 표시할 일정이 없습니다';
  if(!rows.length){
    body.innerHTML = '<div class="empty">이 날에는 표시할 일정이 없습니다.<br>위 칩에서 꺼 둔 종류가 있는지 확인해 보세요.</div>';
    return;
  }
  SEL = Math.max(0, Math.min(SEL, rows.length-1));
  const e = rows[SEL], m = kindOf(String(e.분류||'etc'));
  body.innerHTML = rows.map((r,i) => {
    const km = kindOf(String(r.분류||'etc'));
    return '<div class="item" style="cursor:pointer' + (i===SEL?';font-weight:750':'')
      + '" onclick="pickEvent(' + i + ')"><div class="t">'
      + '<i class="kdot" style="background:' + esc(km.color) + '"></i>' + esc(campOf(r)) + '</div>'
      + '<div class="m">' + [km.label, r.담당기사, r.프로젝트NO, r.시간].filter(Boolean).map(esc).join(' · ')
      + '</div></div>';
  }).join('')
  + '<div class="card" style="margin-top:10px;padding:11px 13px;font-size:13.5px;line-height:1.6">'
  + '<div style="font-weight:800;margin-bottom:5px">' + esc(e.제목 || campOf(e)) + '</div>'
  + '<div style="color:var(--ink-3)">' + esc(m.label) + ' · ' + esc(e.날짜||'')
  + (e.시간 ? ' ' + esc(e.시간) : ' 종일') + '</div>'
  + (e.프로젝트NO ? '<div>프로젝트 ' + esc(e.프로젝트NO) + '</div>' : '')
  + (e.담당기사 ? '<div>담당기사 ' + esc(e.담당기사) + '</div>' : '')
  + (e.예측 ? '<div style="color:var(--danger);margin-top:4px">과거 점검일로 계산한 예상일입니다 — 확정 일정이 아닙니다.</div>' : '')
  + '</div>';
}
document.addEventListener('keydown', (ev) => {
  if(ev.key === 'Escape') closeSheet();
});
(function(){
  let y0 = null;
  document.addEventListener('touchstart', (ev) => {
    const w = $('sheet');
    if(!w || !w.classList.contains('open')){ y0 = null; return; }
    const p = w.querySelector('.panel');
    if(!p || !p.contains(ev.target)){ y0 = null; return; }
    const b = $('sheetBody');
    if(b && b.contains(ev.target) && b.scrollTop > 0){ y0 = null; return; }
    y0 = ev.touches[0].clientY;
  }, {passive:true});
  document.addEventListener('touchend', (ev) => {
    if(y0 == null) return;
    const dy = ev.changedTouches[0].clientY - y0; y0 = null;
    if(dy > 70) closeSheet();
  }, {passive:true});
})();

function render(){
  const all = CAL.일정 || [];
  if(!all.length){ $('main').innerHTML = '<div class="empty">표시할 일정이 없습니다.</div>'; return; }
  if(!M){
    const now = new Date().toISOString().slice(0,7);
    M = all.some(e => String(e.날짜||'').startsWith(now)) ? now
      : String(all[all.length-1].날짜||now).slice(0,7);
  }
  const [Y, Mo] = M.split('-').map(Number);
  const month = all.filter(e => String(e.날짜||'').startsWith(M));
  const rows = month.filter(e => !OFF.has(String(e.분류||'etc')));
  const byDay = {};
  rows.forEach(e => { (byDay[e.날짜] = byDay[e.날짜] || []).push(e); });

  const cnt = {};
  month.forEach(e => { const k = String(e.분류||'etc'); cnt[k] = (cnt[k]||0) + 1; });
  const chips = Object.keys(cnt).map(k => {
    const m = kindOf(k);
    return `<button class="cchip${OFF.has(k)?'':' on'}" data-k="${esc(k)}" style="--c:${esc(m.color)}">`
      + `<i></i>${esc(m.label)} ${cnt[k]}</button>`;
  }).join('');

  const first = new Date(Y, Mo-1, 1), start = new Date(Y, Mo-1, 1-first.getDay());
  const todayIso = isoOf(new Date());
  let grid = '';
  for(let i=0;i<42;i++){
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate()+i);
    const iso = isoOf(d);
    const evs = byDay[iso] || [], out = (d.getMonth()+1) !== Mo;
    const dots = [...new Set(evs.map(e => String(e.분류||'etc')))].slice(0,4)
      .map(k => `<i style="background:${esc(kindOf(k).color)}"></i>`).join('');
    // PC 용 글자 칸도 같이 실어 보낸다 — 감추는 것은 CSS 가 한다(창 크기가 바뀌어도 안전).
    const TXN = 4;
    const txs = evs.slice(0,TXN).map(e => {
      const m = kindOf(String(e.분류||'etc'));
      const tm = e.시간 ? `<span class="tm">${esc(String(e.시간).slice(0,5))}</span>` : '';
      return `<span class="ctx" style="--c:${esc(m.color)}">${tm}${esc(campOf(e))}</span>`;
    }).join('') + (evs.length > TXN ? `<span class="ctxmore">+${evs.length-TXN}건 더</span>` : '');
    const cls = 'cday' + (out?' out':'') + (iso===DAY?' on':'') + (iso===todayIso?' today':'')
      + (d.getDay()===0?' sun':'') + (d.getDay()===6?' sat':'');
    grid += `<button class="${cls}" data-d="${iso}"><b>${d.getDate()}</b>`
      + `${evs.length?`<span class="dots">${dots}</span>`:''}<span class="ctxs">${txs}</span></button>`;
  }
  const day = DAY && byDay[DAY] ? byDay[DAY] : null;
  const list = (day || rows).slice(0,400).map(e => {
    const m = kindOf(String(e.분류||'etc'));
    return `<div class="item"><div class="t"><i class="kdot" style="background:${esc(m.color)}"></i>`
      + `${esc(String(e.날짜||'').slice(5))} ${esc(campOf(e))}</div>`
      + `<div class="m">${[m.label, e.담당기사, e.프로젝트NO, e.시간].filter(Boolean).map(esc).join(' · ')}</div></div>`;
  }).join('');

  $('main').innerHTML =
    `<div class="cnav"><button id="cprev">‹</button><b>${Y}년 ${Mo}월</b>`
    + `<button id="cnext">›</button><button id="ctoday">오늘</button></div>`
    + `<div class="cchips">${chips}</div>`
    + `<div class="cdow"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>`
    + `<div class="cgrid">${grid}</div>`
    + `<div class="note">${day ? esc(DAY)+' · '+day.length+'건 (날짜를 누르면 창으로 자세히)'
                               : '이 달 '+rows.length+'건 · 날짜를 누르면 그 날 일정이 창으로 열립니다'}</div>`
    + `<div class="card">${list || '<div class="empty">표시할 일정이 없습니다.</div>'}</div>`;

  const shift = n => { const d = new Date(Y, Mo-1+n, 1);
    M = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); DAY=''; render(); };
  $('cprev').onclick = () => shift(-1);
  $('cnext').onclick = () => shift(1);
  $('ctoday').onclick = () => { M = new Date().toISOString().slice(0,7); DAY=''; render(); };
  document.querySelectorAll('.cday').forEach(b => b.onclick = () => {
    DAY = b.dataset.d; SEL = 0; render(); openSheet(); });
  document.querySelectorAll('.cchip').forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    if(OFF.has(k)) OFF.delete(k); else OFF.add(k);
    // 전부 끄면 빈 화면이 남아 고장으로 보인다 — 마지막 하나는 도로 켠다.
    if(Object.keys(cnt).every(x => OFF.has(x))) OFF.delete(k);
    DAY=''; render(); });
}

/* 열쇠는 ① 주소의 `#k=` ② 이 기기에 기억해 둔 것 순으로 찾는다.
   ★ 기억이 왜 필요한가 — 홈 화면에 설치한 아이콘은 **주소의 `#` 뒤를 못 가지고 간다**
     (설치 주소에는 `#` 이 없다). 기억해 두지 않으면 설치한 아이콘이 매번
     '열쇠가 없는 주소입니다'만 띄운다. 기억하는 것은 링크를 저장해 두는 것과 같다. */
let KEY = '';
function currentKey(){ return KEY; }
function rememberKey(k){ KEY = k; try{ localStorage.setItem(KSTORE, k); }catch(e){} }
function askKey(){
  $('sub').textContent = '';
  $('main').innerHTML = '<div class="err"><b>열쇠가 없는 주소입니다.</b><br>'
    + '단톡방에 올라온 링크를 <b>그대로</b> 눌러 주세요. 주소를 손으로 옮겨 적으면 '
    + '<code>#</code> 뒤가 빠져 열리지 않습니다.'
    + '<input id="kin" placeholder="받은 주소를 여기에 붙여넣어도 됩니다" autocomplete="off">'
    + '<button id="kgo">이 주소로 열기</button></div>';
  const go = $('kgo');
  if(go) go.onclick = () => {
    const v = String(($('kin')||{}).value || '');
    const m = v.match(/[#?&]k=([A-Za-z0-9_\-]+)/);
    if(!m){ alert('주소에서 열쇠(#k=…)를 찾지 못했습니다. 링크 전체를 붙여넣어 주세요.'); return; }
    location.hash = 'k=' + m[1];
    location.reload();
  };
}

(async function(){
  // 서비스워커가 있어야 크롬이 **진짜 앱 설치**를 제안한다(없으면 단순 북마크).
  try{ if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js'); }catch(e){}
  const b = $('binstall'); if(b) b.onclick = doInstall;

  let k = new URLSearchParams(location.hash.slice(1)).get('k') || '';
  if(!k){ try{ k = localStorage.getItem(KSTORE) || ''; }catch(e){} }
  if(!k){ askKey(); return; }
  KEY = k;
  try{
    const enc = await (await fetch('cal.enc?t=' + Date.now(), {cache:'no-store'})).json();
    CAL = await unseal(enc, k);
    rememberKey(k);
    $('sub').textContent = `갱신 ${String(CAL.갱신||'').replace('T',' ').slice(0,16)} · 일정 ${(CAL.일정||[]).length}건`;
    render();
    offerInstall();
  }catch(e){
    $('sub').textContent = '';
    $('main').innerHTML = '<div class="err"><b>일정을 열지 못했습니다.</b><br>'
      + '링크가 오래되어 열쇠가 바뀌었을 수 있습니다. 담당자에게 새 링크를 요청하세요.</div>';
    try{ localStorage.removeItem(KSTORE); }catch(e2){}
  }
})();
</script>
</body></html>
