<script>
const $ = id => document.getElementById(id);
const FIXED = location.origin + location.pathname.replace(/app\.html$/, '');
let D = null, TAB = 'issues', PIN = localStorage.getItem('csos_pin') || '';
const DEVICE = localStorage.getItem('csos_device') || crypto.randomUUID();
localStorage.setItem('csos_device', DEVICE);

/* ── 잠긴 사본 열기 ─────────────────────────────────────────────
   공개 저장소에 올려 둔 파일이라 잠겨 있다. 브라우저 내장 암호기능으로 그 자리에서 푼다.
   PIN이 틀리면 HMAC 확인에서 걸러진다 — 엉뚱한 데이터를 그리는 일이 없다. */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unseal(enc, pin){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin),
                                           'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits(
    {name:'PBKDF2', salt:b64(enc.salt), iterations:enc.iter, hash:'SHA-256'}, km, 512));
  const iv = b64(enc.iv), ct = b64(enc.ct);
  const hk = await crypto.subtle.importKey('raw', bits.slice(32,64),
                                           {name:'HMAC', hash:'SHA-256'}, false, ['verify']);
  const signed = new Uint8Array(iv.length + ct.length);
  signed.set(iv); signed.set(ct, iv.length);
  if(!(await crypto.subtle.verify('HMAC', hk, b64(enc.tag), signed))) throw new Error('PIN');
  const ck = await crypto.subtle.importKey('raw', bits.slice(0,32), {name:'AES-CBC'}, false, ['decrypt']);
  let pt = new Uint8Array(await crypto.subtle.decrypt({name:'AES-CBC', iv}, ck, ct));
  if(enc.zip === 'deflate'){
    pt = await new Response(new Blob([pt]).stream()
           .pipeThrough(new DecompressionStream('deflate'))).arrayBuffer();
  }
  return JSON.parse(new TextDecoder().decode(pt));
}

function hexBytes(s){
  const out = new Uint8Array((s||'').length/2);
  for(let i=0;i<out.length;i++) out[i]=parseInt(s.slice(i*2,i*2+2),16);
  return out;
}
function bytesHex(a){ return [...a].map(v=>v.toString(16).padStart(2,'0')).join(''); }
async function snapshotPassword(enc, pin){
  const a=enc.pin_auth;
  if(!a || a.mode!=='auth-pbkdf2-sha256') return pin;
  const km=await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveBits']);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({
    name:'PBKDF2', salt:hexBytes(a.salt_hex),
    iterations:Number(a.iterations), hash:'SHA-256'
  }, km, 256));
  return bytesHex(bits);
}

async function open(pin){
  const r = await fetch('data.enc?t=' + Date.now(), {cache:'no-store'});
  if(!r.ok) throw new Error('사본을 받지 못했습니다 (' + r.status + ')');
  const enc=await r.json();
  return await unseal(enc, await snapshotPassword(enc, pin));
}

/* ── 프로젝트 코드 조회 ── */
const norm = s => { s = String(s||'').replace(/[\s-]/g,'').toUpperCase();
                    if(/^\d{7}$/.test(s)) s = 'UJ' + s;
                    return /^UJ\d{7}$/.test(s) ? s : null; };
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* 배포 사본 자체도 2026년만 남긴다. 서버가 이미 걸러서 보내지만, 예전 서비스워커나
   브라우저 저장본을 연 경우에도 2025년 행이 다시 나타나지 않게 하는 2차 방어선이다. */
function is2026(r, kind){
  if(!r || typeof r !== 'object') return false;
  const vals = keys => keys.map(k=>String(r[k]||''));
  const dateYear = keys => {
    const dv = vals(keys);
    let y = dv.flatMap(v=>[...v.matchAll(/(^|[^\d])(20\d{2})[-./]/g)].map(m=>m[2]));
    if(y.length) return new Set(y).size===1 && y[0]==='2026';
    y = dv.flatMap(v=>[...v.matchAll(/(^|[^\d])(\d{2})\/\d{2}\/\d{2}\s*-\s*\d+/g)].map(m=>m[2]));
    return y.length ? new Set(y).size===1 && y[0]==='26' : null;
  };
  const idYear = keys => {
    const y = vals(keys).flatMap(v=>[...v.matchAll(/\b(?:AS|PM|JS)-(\d{2})\d{2}(?:-|$)/gi)].map(m=>m[1]));
    return y.length ? new Set(y).size===1 && y[0]==='26' : null;
  };
  const projectYear = () => {
    const y = vals(['프로젝트NO','포함프로젝트','프로젝트명'])
      .flatMap(v=>[...v.matchAll(/\bUJ(\d{2})\d{5}\b/gi)].map(m=>m[1]));
    return y.length ? new Set(y).size===1 && y[0]==='26' : null;
  };
  const rules = {
    as:[['접수일자'],['접수ID','업무ID']],
    pm:[['점검예정일'],['점검ID','업무ID']],
    settle:[['완료일'],['원천업무ID','정산ID','업무ID']],
    erp:[['월','전표'],[]], visit:[['방문일'],[]],
    unbilled:[['발행일'],[]],
    issue:[['기준일','접수일자','점검예정일','완료일','발행일','일자'],
           ['업무ID','접수ID','점검ID','정산ID','ID']]
  };
  const rule = rules[kind] || [[],[]];
  let y = dateYear(rule[0]); if(y!==null) return y;
  y = idYear(rule[1]); if(y!==null) return y;
  y = projectYear(); return y===true;
}
function hide2025(r){
  const old=/\bUJ25\d{5}\b|\b(?:AS|PM|JS)-25\d{2}-\d{3}\b|(?<!\d)2025[-./]\d{1,2}(?:[-./]\d{1,2})?|2025년|(?<!\d)25(?:년도|년)/g;
  return Object.fromEntries(Object.entries(r||{}).map(([k,v])=>
    [k,typeof v==='string'?v.replace(old,'').trim():v]));
}
function codeIs2026(k,r){
  if(!/^UJ26\d{5}$/i.test(k) || !r || typeof r!=='object') return false;
  const blob=JSON.stringify(r);
  const dates=[...blob.matchAll(/(^|[^\d])(20\d{2})[-./]/g)].map(m=>m[2]);
  const ids=[...blob.matchAll(/\b(?:AS|PM|JS)-(\d{2})\d{2}(?:-|$)/gi)].map(m=>m[1]);
  const projects=[...blob.matchAll(/\bUJ(\d{2})\d{5}\b/gi)].map(m=>m[1]);
  return (!dates.length || (new Set(dates).size===1 && dates[0]==='2026')) &&
         (!ids.length || (new Set(ids).size===1 && ids[0]==='26')) &&
         (!projects.length || (new Set(projects).size===1 && projects[0]==='26'));
}
function keep2026(d){
  const kinds = {issues:'issue',as:'as',pm:'pm',settle:'settle',erp:'erp',
                 visits:'visit',unbilled:'unbilled'};
  Object.entries(kinds).forEach(([k,kind])=>{
    d[k] = (d[k]||[]).filter(r=>is2026(r,kind)).map(hide2025);
  });
  if(d.app_year !== '2026') d.tech_gap = {'미방문':0,'기사미기입':0};
  d.codes = Object.fromEntries(Object.entries(d.codes||{}).filter(([k,r])=>codeIs2026(k,r)));
  const by = {};
  (d.visits||[]).forEach(v=>{
    const t = v['기사']||'미기입', x = by[t] ||= {'기사':t,'총':0,'돌발AS':0,'정기점검':0,'캠프':new Set(),'최근':''};
    x['총']++; x[v['업무']] = (x[v['업무']]||0)+1;
    if(v['캠프명']) x['캠프'].add(v['캠프명']);
    if((v['방문일']||'') > x['최근']) x['최근'] = v['방문일'];
  });
  d.tech = Object.values(by).map(x=>({...x,'캠프수':x['캠프'].size,'캠프':undefined}))
          .sort((a,b)=>b['총']-a['총']);
  return d;
}

function cloudSheetToPng(){
  const rows = window._cloudSheetRows || [];
  const cap = 60, shown = rows.slice(0, cap), W = 1200, top = 170, rowH = 82;
  const H = top + Math.max(1, shown.length) * rowH + (rows.length > cap ? 68 : 28);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  x.fillStyle = '#f7f8fc'; x.fillRect(0,0,W,H);
  x.fillStyle = '#101828'; x.font = '800 34px "Malgun Gothic", sans-serif';
  x.fillText(window._cloudSheetTitle || ('확인 목록 ' + rows.length + '건'), 52, 58);
  x.fillStyle = '#667085'; x.font = '22px "Malgun Gothic", sans-serif';
  x.fillText('기준일 ' + (((D || {}).brief || {})['기준일'] || '-') +
             ' · 프로젝트 / 캠프 / 일자 / 담당 / 점검ID', 52, 100);
  x.fillStyle = '#8a4b08'; x.font = '20px "Malgun Gothic", sans-serif';
  x.fillText(window._cloudSheetNote || '', 52, 137);
  shown.forEach((r,i) => {
    const y = top + i * rowH;
    x.fillStyle = i%2 ? '#f2f4f8' : '#ffffff'; x.fillRect(38,y-25,W-76,rowH-4);
    x.fillStyle = '#101828'; x.font = '700 22px "Malgun Gothic", sans-serif';
    x.fillText((r['프로젝트NO'] || '번호 미기입') + ' · ' + (r['캠프명'] || '캠프 미기입'), 55, y+6);
    x.fillStyle = '#667085'; x.font = '19px "Malgun Gothic", sans-serif';
    x.fillText([r['일자'] || r['접수일'] || '날짜 미기입', r['담당기사'] || '담당 미지정',
                r['레코드ID'] || '원천ID 미기입', r['상태'] || ''].filter(Boolean).join(' · '), 55, y+38);
  });
  if(rows.length > cap){
    x.fillStyle = '#8a4b08'; x.font = '20px "Malgun Gothic", sans-serif';
    x.fillText('이 이미지에는 앞 ' + cap + '건만 표시됨 · 전체 ' + rows.length + '건은 앱 목록에서 확인', 52, H-24);
  }
  return new Promise(resolve => c.toBlob(resolve, 'image/png'));
}

async function saveStaleCloud(){

async function shareStaleCloud(){
  const blob = await staleToPng(); if(!blob) return;

  if(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
    try{ await navigator.share({title:window._cloudSheetTitle||'확인 목록', files:[file]}); return; }
    catch(e){ if(e && e.name === 'AbortError') return; }

    const p = $('dlgfoot').querySelector('.primary');
    if(p){ try{ p.focus(); }catch(_){} }
  });
}

/* ── 등록 예약 — PC가 켜진 뒤 이 폰 앱을 열면 원장으로 전송한다 ── */
const Q = () => JSON.parse(localStorage.getItem('csos_queue') || '[]');
const setQ = q => localStorage.setItem('csos_queue', JSON.stringify(q));

function queueAdd(code){
  const q = Q();
  if(q.some(x => x.code === code)){ notice(code + ' 는 이미 예약되어 있습니다.', '이미 예약됨'); return; }
  q.push({code, at:new Date().toISOString(), key:crypto.randomUUID()});
  setQ(q); renderTabs(); setTab('queue');
  syncQueue();
  notice(code + ' 등록을 예약했습니다.\n클라우드에 보관되며 PC가 켜지면 자동 반영됩니다.', '예약 완료');
}

/* PC가 꺼져 있어도 클라우드 영구 큐에 먼저 저장한다.
   서버가 접수한 뒤에만 기기 임시 큐를 비워 네트워크 끊김에도 예약을 잃지 않는다. */
async function syncQueue(){
  const q = Q(); if(!q.length) return;
  const cq = D && D.cloud_queue;
  if(!cq || !cq.url || !cq.token) return;
  try{
    const r = await fetch(cq.url.replace(/\/$/,'') + '/api/queue', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer ' + cq.token},
      body:JSON.stringify({
        clientId:DEVICE,
        items:q.map(x=>({code:x.code, at:x.at, key:x.key || (DEVICE + ':' + x.code + ':' + x.at)}))
      })});
    if(!r.ok) return;
    const out = await r.json();
    if(!out.ok) return;
    setQ([]); renderTabs(); if(TAB==='queue') renderList();
    $('net').textContent = '클라우드 보관 완료 · ' + ((out.accepted||0) + (out.duplicate||0)) + '건';
  }catch(e){ /* 통신 복구 시 online 이벤트와 다음 실행에서 다시 보낸다 */ }
}

/* ── 쿠팡 캘린더 (2026-08-06 지시) ─────────────────────────────────────────
   왜 여기에 넣나: 사설망(Tailscale) 주소는 각자 폰에 VPN 을 깔아야 열린다. 현장
   기사들에게 그것을 시킬 수는 없다. 고정 주소는 누구나 열리고, 자료는 잠겨 올라오므로
   PIN 을 아는 사람만 본다. 그래서 단톡방에 뿌릴 주소는 여기다.
   PC 앱의 캘린더와 **같은 자료**(app_server.get_calendar)를 쓴다 — 따로 만들면
   화면마다 숫자가 달라진다. */
let CAL_M = '';                       // 'YYYY-MM'
let CAL_D = '';                       // 'YYYY-MM-DD'
let CAL_OFFK = new Set();             // 꺼 둔 종류
function calData(){ return D.calendar || {일정: [], 분류목록: []}; }
function calKind(k){
  return (calData().분류목록 || []).find(x => x.key === k) || {key: k, label: k || '기타', color: '#8E8E93'};
}
function calRows(){
  return (calData().일정 || []).filter(e => !CAL_OFFK.has(String(e.분류 || 'etc')));
}
function calCamp(e){ return String(e.캠프명 || e.장소 || e.제목 || '').trim() || '(장소 미입력)'; }
function renderCal(){
  const all = calData().일정 || [];
  if(!all.length){ $('list').innerHTML = '<div class="empty">캘린더 자료가 아직 사본에 없습니다.</div>'; return; }
  if(!CAL_M){
    const today = new Date().toISOString().slice(0, 7);
    CAL_M = all.some(e => String(e.날짜 || '').startsWith(today))
      ? today : String(all[all.length - 1].날짜 || today).slice(0, 7);
  }
  const rows = calRows().filter(e => String(e.날짜 || '').startsWith(CAL_M));
  const [Y, M] = CAL_M.split('-').map(Number);
  const byDay = {};
  rows.forEach(e => { (byDay[e.날짜] = byDay[e.날짜] || []).push(e); });

  // 종류 칩 — 개수와 색을 같이 보여 준다(색만으로는 무엇인지 모른다)
  const cnt = {};
  (calData().일정 || []).filter(e => String(e.날짜 || '').startsWith(CAL_M))
    .forEach(e => { const k = String(e.분류 || 'etc'); cnt[k] = (cnt[k] || 0) + 1; });
  const chips = Object.keys(cnt).map(k => {
    const m = calKind(k), on = !CAL_OFFK.has(k);
    return '<button class="cchip' + (on ? ' on' : '') + '" data-k="' + esc(k) + '" style="--c:' + esc(m.color) + '">'
      + '<i></i>' + esc(m.label) + ' ' + cnt[k] + '</button>';
  }).join('');

  const first = new Date(Y, M - 1, 1), start = new Date(Y, M - 1, 1 - first.getDay());
  let grid = '';
  for(let i = 0; i < 42; i++){
    const dt = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    const iso = dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
    const evs = byDay[iso] || [], out = (dt.getMonth() + 1) !== M;
    const dots = [...new Set(evs.map(e => String(e.분류 || 'etc')))].slice(0, 4)
      .map(k => '<i style="background:' + esc(calKind(k).color) + '"></i>').join('');
    grid += '<button class="cday' + (out ? ' out' : '') + (iso === CAL_D ? ' on' : '') + '" data-d="' + iso + '">'
      + '<b>' + dt.getDate() + '</b>' + (evs.length ? '<span class="dots">' + dots + '</span>' : '') + '</button>';
  }
  const day = CAL_D && byDay[CAL_D] ? byDay[CAL_D] : null;
  const list = (day || rows).slice(0, 400).map(e => {
    const m = calKind(String(e.분류 || 'etc'));
    return '<div class="item"><div class="t"><i class="kdot" style="background:' + esc(m.color) + '"></i>'
      + esc(String(e.날짜 || '').slice(5)) + ' ' + esc(calCamp(e)) + '</div>'
      + '<div class="m">' + [m.label, e.담당기사, e.프로젝트NO, e.시간].filter(Boolean).map(esc).join(' · ') + '</div></div>';
  }).join('');

  $('list').innerHTML =
    '<div class="cnav"><button id="cprev">‹</button><b>' + Y + '년 ' + M + '월</b><button id="cnext">›</button>'
    + '<button id="ctoday">오늘</button></div>'
    + '<div class="cchips">' + chips + '</div>'
    + '<div class="cdow"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>'
    + '<div class="cgrid">' + grid + '</div>'
    + '<div class="note">' + (day ? esc(CAL_D) + ' · ' + day.length + '건 (날짜를 다시 누르면 전체)' : '이 달 전체 ' + rows.length + '건') + '</div>'
    + (list || '<div class="empty">표시할 일정이 없습니다.</div>');

  const shift = n => {
    const d = new Date(Y, M - 1 + n, 1);
    CAL_M = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    CAL_D = ''; renderCal();
  };
  $('cprev').onclick = () => shift(-1);
  $('cnext').onclick = () => shift(1);
  $('ctoday').onclick = () => { CAL_M = new Date().toISOString().slice(0, 7); CAL_D = ''; renderCal(); };
  $('list').querySelectorAll('.cday').forEach(b => b.onclick = () => {
    CAL_D = (CAL_D === b.dataset.d) ? '' : b.dataset.d; renderCal();
  });
  $('list').querySelectorAll('.cchip').forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    if(CAL_OFFK.has(k)) CAL_OFFK.delete(k); else CAL_OFFK.add(k);
    // 전부 끄면 빈 화면이 남아 고장으로 보인다 — 마지막 하나는 도로 켠다.
    if(Object.keys(cnt).every(x => CAL_OFFK.has(x))) CAL_OFFK.delete(k);
    CAL_D = ''; renderCal();
  });
}

/* ── 미청구 경과 ──
   ★ 경과일은 **여기서 오늘 날짜로 계산한다**. 사본이 며칠 묵어도 '몇 일 지났는지'는
     항상 정확하다. (예전에는 GitHub Actions가 매일 세어 메일을 보냈지만, 메일을 원하지
     않으셔서 앱을 열 때 화면에서 보이도록 옮겼다.) */
const DAYS = iso => Math.floor((Date.now() - new Date(iso + 'T00:00:00').getTime()) / 86400000);

function renderAlert(){
  const box = $('alertbox'); if(!box) return;
  const rows = (D.unbilled || []).map(u => ({...u, d: DAYS(u['발행일'])}))
                                 .sort((a,b) => b.d - a.d);
  if(!rows.length){ box.innerHTML = ''; return; }
  const old90 = rows.filter(r => r.d >= 90);
  const sum = rows.reduce((a,r) => a + (r['금액']||0), 0);
  const sum90 = old90.reduce((a,r) => a + (r['금액']||0), 0);
  const lvl = old90.length ? 'bad' : 'warn';
  box.innerHTML =
    `<div class="card" style="border-color:var(--${lvl});border-width:2px">
       <h3 style="color:var(--${lvl})">미청구 ${rows.length}건 · ${fmt(sum)}원</h3>
       ${old90.length ? `<div style="font-weight:800;color:var(--bad);font-size:13.5px">
           90일 넘은 것 ${old90.length}건 · ${fmt(sum90)}원</div>` : ''}
       <div id="ublist" style="margin-top:6px"></div>
       <button id="ubmore" class="btn ghost" style="width:100%;margin-top:8px;padding:9px">
         ${rows.length > 3 ? '전체 ' + rows.length + '건 보기' : ''}</button>
     </div>`;
  const draw = (n) => {
    $('ublist').innerHTML = rows.slice(0, n).map(r => {
      const tag = r.d >= 120 ? 'p-bad' : (r.d >= 90 ? 'p-warn' : '');
      return line(fmt(r['금액']) + '원 <span class="pill ' + tag + '">' + r.d + '일</span>',
                  esc(r['발행일']) + ' · ' + esc(r['PO']) + (r['내용'] ? ' · ' + esc(r['내용']) : ''));
    }).join('');
  };
  draw(3);
  const b = $('ubmore');
  if(rows.length > 3){ b.onclick = () => { draw(rows.length); b.remove(); }; }
  else b.remove();
}

/* ── 실시간 PC 앱은 선택 연결 ────────────────────────────────
   앱 시작은 절대 터널에 의존하지 않는다. PC가 살아 있을 때만 선택 버튼을 보여 준다. */
async function updateMode(){
  const card = $('modecard');
  let timer;
  try{
    const cq = D && D.cloud_queue;
    if(!cq || !cq.url) throw new Error('클라우드 설정 없음');
    const cloud = await fetch(cq.url.replace(/\/$/,'') + '/api/ping?t=' + Date.now(), {cache:'no-store'});
    if(!cloud.ok) throw new Error('클라우드 연결 안 됨');
    card.innerHTML =
      '<h3 style="color:var(--ok)">PC 독립 모드 · 클라우드 보관 정상</h3>' +
      '<div class="note" style="margin-top:2px">사무실 PC가 꺼져 있어도 등록 예약을 보관합니다. PC가 켜지면 관리대장에 자동 반영합니다.</div>';

    const ep = await (await fetch('endpoint.json?t=' + Date.now(), {cache:'no-store'})).json();
    if(!ep || !ep.url) throw new Error('주소 없음');
    const c = new AbortController();
    timer = setTimeout(() => c.abort(), 3500);
    const r = await fetch(ep.url.replace(/\/$/,'') + '/api/ping?t=' + Date.now(),
                          {cache:'no-store', mode:'no-cors', signal:c.signal});
    if(!(r.ok || r.type === 'opaque')) throw new Error('연결 안 됨');
    card.innerHTML =
      '<h3 style="color:var(--ok)">PC 독립 모드 · 실시간 연결 가능</h3>' +
      '<div class="note" style="margin-top:2px">지금은 사무실 PC의 전체 기능도 사용할 수 있습니다.</div>' +
      '<button class="btn ghost" id="liveOpen" style="width:100%;margin-top:9px">실시간 PC 앱 열기</button>';
    /* ★ 이 창을 터널 주소로 **옮기지 않는다**(2026-07-28 실사고).
       옮기면 창이 터널 주소에 머물고, 크롬이 종료 시점 주소를 그대로 복원한다.
       터널 주소는 껐다 켤 때마다 새로 발급되므로 다음 부팅에는 죽은 이름이 되어
       ERR_NAME_NOT_RESOLVED 가 뜬다 — 며칠간 "앱이 안 열린다"의 정체가 이것이었다.
       새 창으로 띄우면 고정 주소 창은 늘 고정 주소에 남는다. */
    $('liveOpen').onclick = () => window.open(ep.url, '_blank', 'noopener');
  }catch(e){
    if(!card.innerHTML.includes('클라우드 보관 정상')){
      card.innerHTML =
        '<h3 style="color:var(--ok)">PC 독립 모드</h3>' +
        '<div class="note" style="margin-top:2px">조회는 계속할 수 있습니다. 클라우드 접속이 복구되면 예약이 자동 전송됩니다.</div>';
    }
  }finally{
    clearTimeout(timer);
  }
}

/* ── 시작 ── */
async function boot(pin){
  $('gerr').innerHTML = '';
  try{
    D = keep2026(await open(pin));
  }catch(e){
    $('gerr').innerHTML = '<div class="err">' +
      (e.message === 'PIN' ? 'PIN이 맞지 않습니다.' : esc(e.message)) + '</div>';
    return false;
  }
  PIN = pin; localStorage.setItem('csos_pin', pin);
  $('gate').style.display = 'none'; $('app').style.display = '';
  /* PC가 꺼져 넘어온 경우 그 사실을 분명히 적는다 — 숫자가 언제 것인지 모르면
     사람은 화면을 못 믿는다. 이유는 고정 페이지가 넘겨줄 때 남겨 둔다. */
  let why = '';
  try{ why = sessionStorage.getItem('csos_offline_why') || ''; }catch(e){}
  $('hsub').textContent = 'PC 독립 사본 · 2026년 전용 · ' + (D.gen || D['기준'] || '');
  if(why){
    const b = document.createElement('div');
    b.className = 'card';
    b.style.cssText = 'border-color:var(--warn);border-width:2px;margin-top:12px';
    b.innerHTML = '<h3 style="color:var(--warn)">사무실 PC가 꺼져 있습니다</h3>' +
      '<div class="note" style="margin-top:2px">' + esc(why) +
      ' 아래 숫자는 <b>' + esc(D.gen || '') + '</b> 기준 사본입니다.<br>' +
      '조회·프로젝트 코드 자동채움은 그대로 되고, 등록은 예약해 둔 뒤 PC가 켜지면 이 앱을 다시 열어 전송합니다.</div>';
    const box = $('alertbox');
    if(box) box.parentNode.insertBefore(b, box);
  }
  $('stamp').textContent = '사본 기준 ' + (D.gen || D['기준'] || '') + ' · 코드 ' + Object.keys(D.codes||{}).length;
  renderBrief(); renderAlert(); renderTabs(); renderList(); updateMode(); syncQueue();
  return true;
}

$('go').onclick = () => boot($('pin').value.trim());
$('pin').onkeydown = e => { if(e.key === 'Enter') $('go').click(); };
$('pin').oninput = e => { if(e.target.value.length === 4) $('go').click(); };
$('find').onclick = findCode;
$('code').onkeydown = e => { if(e.key === 'Enter') findCode(); };
$('reload').onclick = () => location.reload();
$('sheetclose').onclick = closeBriefSheet;
$('sheetbg').onclick = e => { if(e.target === $('sheetbg')) closeBriefSheet(); };
$('sheetshare').onclick = shareStaleCloud;
$('sheetsave').onclick = saveStaleCloud;
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeBriefSheet(); });

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
if(PIN) boot(PIN).then(ok => { if(!ok){ $('gate').style.display=''; $('pin').value=''; } });
window.addEventListener('online', syncQueue);
</script>
</body></html>
