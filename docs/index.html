<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1B3F">
<title>Coupang Service Operations System</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CSOS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#060D2B">
<style>
:root{--navy:#0E1B3F;--brand:#2452E6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Nanum Gothic","Malgun Gothic",-apple-system,sans-serif;
 background:radial-gradient(900px 500px at 70% -10%,#24409A,var(--navy) 55%,#0A1430);
 min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px;color:#fff}
.card{background:#fff;color:#101828;border-radius:22px;padding:30px 26px;max-width:380px;width:100%;
 text-align:center;box-shadow:0 22px 60px rgba(0,0,0,.45)}
.logo{width:66px;height:66px;margin:0 auto 14px;border-radius:19px;
 background:linear-gradient(135deg,#3D68FF,#1533A3 46%,#060D2B);display:flex;align-items:center;justify-content:center;
 box-shadow:0 10px 24px rgba(21,51,163,.45)}
.logo svg{width:46px;height:46px}
h1{font-size:16.5px;letter-spacing:-.3px;margin-bottom:4px}
.sub{font-size:12px;color:#667085;margin-bottom:20px}
.state{font-size:13.5px;color:#475467;min-height:44px;display:flex;align-items:center;justify-content:center;gap:8px}
.spin{width:15px;height:15px;border:2.5px solid #E4E9F0;border-top-color:var(--brand);
 border-radius:50%;animation:s .8s linear infinite;display:inline-block}
@keyframes s{to{transform:rotate(360deg)}}
a.btn{display:block;margin-top:12px;background:var(--brand);color:#fff;text-decoration:none;
 padding:13px;border-radius:12px;font-weight:800;font-size:14.5px;box-shadow:0 6px 16px rgba(36,82,230,.32)}
.err{background:#FDEBEC;color:#B91C1C;border-radius:11px;padding:11px;font-size:12.5px;line-height:1.6;margin-top:12px}
.tip{font-size:11px;color:#98A2B3;margin-top:14px;line-height:1.65}
.addr{margin-top:16px;background:#F2F5FB;border:1px solid #E1E8F5;border-radius:11px;padding:10px 12px;
 font-size:12px;font-weight:800;color:#1C3FA8;word-break:break-all;letter-spacing:-.2px}
</style></head>
<body><div class="card">
  <div class="logo"><svg viewBox="0 0 512 512" aria-hidden="true">
    <defs><linearGradient id="lg" x1=".08" y1="1" x2=".92" y2="0">
      <stop offset="0" stop-color="#fff"/><stop offset=".46" stop-color="#D6FBEA"/>
      <stop offset="1" stop-color="#1FDD86"/></linearGradient></defs>
    <path d="M122 262 L214 352 L396 116" fill="none" stroke="url(#lg)" stroke-width="62"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="136" y="404" width="240" height="30" rx="15" fill="#fff" opacity=".95"/>
    <rect x="182" y="452" width="148" height="18" rx="9" fill="#fff" opacity=".4"/></svg></div>
  <h1>Coupang Service Operations System</h1>
  <div class="sub">CSOS · UNIVERSAL LIFT</div>
  <div class="state" id="st"><span class="spin"></span> 접속 주소를 확인하는 중…</div>
  <div id="act"></div>
  <div class="addr">mulder4780.github.io/coupang-ecount-reconcile</div>
  <div class="tip">이 주소는 <b>바뀌지 않습니다</b>. 홈 화면에 추가해 두고 쓰세요.<br>
    사무실 PC가 꺼져 있어도 <b>조회는 그대로</b> 됩니다.</div>
</div>
<script>
/* 고정 진입점: 현재 살아있는 터널 주소(endpoint.json)를 읽어 자동 이동한다.
   터널 주소가 바뀌어도 이 페이지 주소는 그대로이므로 폰 북마크를 고칠 필요가 없다. */
/* 크롬이 [설치 및 바로가기 만들기]로 진짜 앱 설치를 해 주려면 서비스 워커가 있어야 한다.
   없으면 메뉴를 눌러도 아무 일이 안 일어나거나 단순 북마크만 생긴다. */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

(async () => {
  const st = document.getElementById('st'), act = document.getElementById('act');

  /* 살아 있는지 **직접 찔러 보고** 넘어간다.
     예전에는 주소만 읽고 바로 이동해서, 터널이 죽어 있으면 폰에는 브라우저 기본 오류
     ("사이트에 연결할 수 없습니다")만 뜨고 왜 안 되는지 알 길이 없었다. */
  const alive = async (url) => {
    try{
      const c = new AbortController();
      const timer = setTimeout(()=>c.abort(), 8000);
      await fetch(url.replace(/\/$/,'') + '/api/ping?t=' + Date.now(),
                  {cache:'no-store', mode:'no-cors', signal:c.signal});
      clearTimeout(timer);
      return true;                       // no-cors라 내용은 못 읽지만, 응답이 오면 살아 있다
    }catch(e){ return false; }
  };

  /* ★ 예전에는 여기서 끝이었다 — PC가 꺼져 있으면 폰에 오류만 뜨고 아무것도 못 했다.
       이제는 **잠긴 사본으로 넘긴다**. 조회·프로젝트코드 자동채움·등록 예약은 PC 없이 된다. */
  const offline = (why) => {
    st.textContent = '';
    act.innerHTML =
      `<a class="btn" href="app.html">오프라인으로 열기</a>` +
      `<div class="tip" style="margin-top:10px">${why}<br>` +
      `조회와 <b>프로젝트 코드 자동채움</b>은 그대로 됩니다. 등록은 예약해 두면 ` +
      `PC가 켜질 때 자동으로 원장에 들어갑니다.</div>`;
  };

  let d;
  try{
    const r = await fetch('endpoint.json?t=' + Date.now(), {cache:'no-store'});
    d = await r.json();
    if(!d.url) throw new Error('no url');
  }catch(e){
    return offline('사무실 PC가 꺼져 있습니다.');
  }

  st.innerHTML = '<span class="spin"></span> 연결을 확인하는 중…';
  if(!(await alive(d.url))){
    const min = d.updated ? Math.round((Date.now() - new Date(d.updated).getTime())/60000) : null;
    return offline('사무실 PC가 꺼져 있습니다' + (min!=null ? ` (주소 갱신 ${min}분 전)` : '') + '.');
  }
  /* ★ 바로 넘겨 버리면 이 화면에서 [설치 및 바로가기 만들기]를 누를 틈이 없다.
       홈 화면 아이콘은 **이 주소에서** 만들어야 오래 가는데, 페이지가 즉시 사라지니
       설치를 할 수가 없었다(2026-07-27 실제 증상).
       그래서 설치된 앱으로 열었을 때만 즉시 넘기고, 브라우저에서 그냥 열었을 때는
       잠깐 멈춰 설치할 기회를 준다. ?stay=1 을 붙이면 아예 안 넘어간다. */
  const installed = window.matchMedia('(display-mode: standalone)').matches
                 || window.navigator.standalone === true;
  const stay = new URLSearchParams(location.search).has('stay');
  act.innerHTML = `<a class="btn" href="${d.url}">지금 열기</a>`;
  if (installed) { location.replace(d.url); return; }
  if (stay) { st.textContent = '이 화면에 머무릅니다. 메뉴에서 [설치 및 바로가기 만들기]를 누르세요.'; return; }

  let left = 4;
  const tick = () => {
    st.textContent = `${left}초 후 접속합니다`;
    if (left-- <= 0) { clearInterval(iv); location.replace(d.url); }
  };
  const iv = setInterval(tick, 1000); tick();
  act.insertAdjacentHTML('beforeend',
    `<button id="stayBtn" style="width:100%;margin-top:8px;background:#EEF2FF;color:#1C3FA8;
      border:0;border-radius:12px;padding:12px;font-weight:800;font-size:14px;
      font-family:inherit;cursor:pointer">여기서 홈 화면에 추가하기</button>
     <div class="tip" style="margin-top:8px">
       홈 화면 아이콘은 <b>이 주소로</b> 만들어야 나중에도 열립니다.</div>`);
  document.getElementById('stayBtn').onclick = () => {
    clearInterval(iv);
    st.innerHTML = '<b>메뉴(⋮) → 설치 및 바로가기 만들기</b>를 누르세요.';
    document.getElementById('stayBtn').remove();
  };
})();
</script>
</body></html>
