# 자동화 후보 일일 검색을 GitHub 무료 서버(Actions)에서 돌린다 — PC 꺼져 있어도 실행.
# 사용자 지시(2026-08-04): "무료 서버에서 PC 안 켜도 구동할 수 있는 방법".
# auto_scout.py 는 표준 라이브러리·비인증 GitHub API 만 쓰므로 비밀키가 필요 없다.
# PC 스케줄러(10:00)와 이중으로 돌아도 무해하다 — 같은 상태 파일을 각자 갱신할 뿐이다.
name: auto-scout
on:
  schedule:
    - cron: "0 1 * * *" # 01:00 UTC = 10:00 KST
  workflow_dispatch: {}
jobs:
  scout:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: run scout
        run: python auto_scout.py
      - name: commit report
        run: |
          git config user.name "auto-scout-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/자동화_후보.md db/auto_scout_seen.json
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "자동화 후보 일일 검색 (GitHub Actions)"
          git pull --rebase origin master
          git push
